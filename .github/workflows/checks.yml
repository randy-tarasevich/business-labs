# Runs on every pull request and every push to main. A red X on a PR means something broke:
# open "Details" to see which check failed and why. See the README's "Checks" section.
#
# The browser tests are split across 3 machines that run at the same time (shards), each inside
# Playwright's ready-made container, so a PR finishes in a few minutes instead of about 9.
# The last job is named "checks": it passes only when every other job passed, and it's the one
# branch protection on main requires. Keep that job name.

name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Math and content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Math and content (no em-dashes, challenge and prediction data)
        run: npm test

  browser:
    name: Browser tests (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image already has the test browser and every system library it needs, so
    # nothing is downloaded or installed per run (that install used to stall for 10+ minutes).
    # The image tag must match @playwright/test in package.json. When you update Playwright,
    # update this tag too; the "Container matches Playwright" step fails with a clear message if not.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Container matches Playwright
        run: |
          want="$(node -p "require('@playwright/test/package.json').version")"
          test "$want" = "1.56.0" || { echo "package.json has Playwright $want; update the container image tag in .github/workflows/checks.yml to v$want-noble"; exit 1; }
      - name: Build
        run: npm run build

      - name: Browser tests (every page, phone width, share links, Copy results, challenges, predictions)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Save the report if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  checks:
    name: checks
    needs: [unit, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo "Math and content: ${{ needs.unit.result }}"
          echo "Browser tests: ${{ needs.browser.result }}"
          test "${{ needs.unit.result }}" = "success" && test "${{ needs.browser.result }}" = "success"
